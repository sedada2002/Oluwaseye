[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantflow"
version = "0.1.0"
description = "QuantFlow: point-in-time growth screen, risk-managed backtest, and SPY comparison report"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "requests>=2.31",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "mypy>=1.9", "pandas-stubs", "types-requests", "httpx"]

[project.scripts]
quantflow = "quantflow.cli:main"

[tool.setuptools.packages.find]
include = ["quantflow*"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
